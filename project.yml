name: PromoTracker
options:
  bundleIdPrefix: me.buongloi
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  PromoTracker:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: "Promo Tracker"
        CFBundleIdentifier: "me.buongloi.promotracker"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        NSCameraUsageDescription: "Promo Tracker cần quyền Camera để quét mã vạch sản phẩm tra cứu chương trình khuyến mãi."
        NSPhotoLibraryUsageDescription: "Promo Tracker cần quyền Thư viện ảnh để chọn ảnh hoặc tệp khi cập nhật dữ liệu."
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: "me.buongloi.promotracker.scan"
            UIApplicationShortcutItemTitle: "Quét Mã Vạch SP"
            UIApplicationShortcutItemSubtitle: "Tra cứu nhanh CTKM bằng Camera"
            UIApplicationShortcutItemIconType: "UIApplicationShortcutIconTypeCapturePhoto"
          - UIApplicationShortcutItemType: "me.buongloi.promotracker.expiring"
            UIApplicationShortcutItemTitle: "CTKM Sắp Hết Hạn"
            UIApplicationShortcutItemSubtitle: "Xem các mã hết hạn trong 3 ngày tới"
            UIApplicationShortcutItemIconType: "UIApplicationShortcutIconTypeAlarm"
          - UIApplicationShortcutItemType: "me.buongloi.promotracker.upload"
            UIApplicationShortcutItemTitle: "Cập Nhật File Excel"
            UIApplicationShortcutItemSubtitle: "Tải lên file Tracking Promotion mới"
            UIApplicationShortcutItemIconType: "UIApplicationShortcutIconTypeCloud"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
